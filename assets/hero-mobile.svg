<svg xmlns="http://www.w3.org/2000/svg" width="440" height="490" viewBox="0 0 440 490" role="img" aria-labelledby="title desc"><title id="title">Charlie James Abejo — product, AI and connected systems</title><desc id="desc">Original portfolio artwork. Subtle animated connectors; respects reduced motion.</desc><style>
text{font-family:Segoe UI,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.flow{stroke-dasharray:6 14;animation:flow 8s linear infinite}.signal{animation:signal 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-160}}@keyframes signal{0%,100%{opacity:.4}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.signal{animation:none!important}}
</style><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#67e0c1" stroke-opacity=".065" stroke-width="1"/></pattern><radialGradient id="glow"><stop stop-color="#67e0c1" stop-opacity=".12"/><stop offset="1" stop-color="#0b2528" stop-opacity="0"/></radialGradient></defs><rect width="440" height="490" rx="20" fill="#0b2528"/><rect width="440" height="490" rx="20" fill="url(#grid)"/><ellipse cx="352.0" cy="196.0" rx="198.0" ry="441.0" fill="url(#glow)"/><rect x=".5" y=".5" width="439" height="489" rx="19.5" fill="none" stroke="#295054"/><text x="24" y="37" font-size="11" fill="#67e0c1" font-weight="600" letter-spacing="1.3">CHARLIE JAMES ABEJO</text><text x="22" y="103" font-size="48" fill="#f3f0e9" font-weight="650" >AI systems.</text><text x="22" y="160" font-size="48" fill="#67e0c1" font-weight="650" >Real products.</text><text x="24" y="197" font-size="16" fill="#a9b9b8" font-weight="400" >From idea to reliable operation.</text><rect x="24" y="228" width="392" height="60" rx="14" fill="#123438" stroke="#295054"/><rect x="36" y="240" width="35" height="35" rx="10" fill="#1e4848"/><text x="46" y="263" font-size="13" fill="#67e0c1" font-weight="600" >01</text><text x="84" y="253" font-size="16" fill="#f3f0e9" font-weight="600" >Product experience</text><text x="84" y="272" font-size="11" fill="#a9b9b8" font-weight="400" >Interfaces people can use</text><rect x="24" y="314" width="392" height="60" rx="14" fill="#123438" stroke="#295054"/><rect x="36" y="326" width="35" height="35" rx="10" fill="#1e4848"/><text x="46" y="349" font-size="13" fill="#67e0c1" font-weight="600" >02</text><text x="84" y="339" font-size="16" fill="#f3f0e9" font-weight="600" >AI &amp; automation</text><text x="84" y="358" font-size="11" fill="#a9b9b8" font-weight="400" >Tools, voice and workflows</text><rect x="24" y="400" width="392" height="60" rx="14" fill="#123438" stroke="#295054"/><rect x="36" y="412" width="35" height="35" rx="10" fill="#1e4848"/><text x="46" y="435" font-size="13" fill="#67e0c1" font-weight="600" >03</text><text x="84" y="425" font-size="16" fill="#f3f0e9" font-weight="600" >Connected systems</text><text x="84" y="444" font-size="11" fill="#a9b9b8" font-weight="400" >APIs, data and operations</text><path d="M220 288V314" stroke="#295054" stroke-width="2"/><path class="flow" d="M220 288V314" stroke="#67e0c1" stroke-width="2"/><path d="M220 374V400" stroke="#295054" stroke-width="2"/><path class="flow" d="M220 374V400" stroke="#67e0c1" stroke-width="2"/></svg>