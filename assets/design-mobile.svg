<svg xmlns="http://www.w3.org/2000/svg" width="440" height="260" viewBox="0 0 440 260" role="img" aria-labelledby="title desc"><title id="title">UI and UX: design tokens, accessible components, purposeful motion, responsive interfaces</title><desc id="desc">Original portfolio artwork. Subtle animated connectors; respects reduced motion.</desc><style>
text{font-family:Segoe UI,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.flow{stroke-dasharray:6 14;animation:flow 8s linear infinite}.signal{animation:signal 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-160}}@keyframes signal{0%,100%{opacity:.4}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.signal{animation:none!important}}
</style><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#67e0c1" stroke-opacity=".065" stroke-width="1"/></pattern><radialGradient id="glow"><stop stop-color="#67e0c1" stop-opacity=".12"/><stop offset="1" stop-color="#0b2528" stop-opacity="0"/></radialGradient></defs><rect width="440" height="260" rx="20" fill="#0b2528"/><rect width="440" height="260" rx="20" fill="url(#grid)"/><ellipse cx="352.0" cy="104.0" rx="198.0" ry="234.0" fill="url(#glow)"/><rect x=".5" y=".5" width="439" height="259" rx="19.5" fill="none" stroke="#295054"/><text x="24" y="32" font-size="11" fill="#67e0c1" font-weight="600" letter-spacing="1.5">UI / UX &amp; DESIGN SYSTEMS</text><text x="24" y="69" font-size="28" fill="#f3f0e9" font-weight="600" >Clear interfaces.</text><text x="24" y="105" font-size="28" fill="#67e0c1" font-weight="600" >Consistent systems.</text><rect x="24" y="121" width="3" height="32" rx="1.5" fill="#67e0c1"/><text x="36" y="133" font-size="14" fill="#f3f0e9" font-weight="600" >Tokens</text><text x="36" y="151" font-size="11" fill="#a9b9b8" font-weight="400" >Color · type · spacing</text><rect x="228" y="121" width="3" height="32" rx="1.5" fill="#67e0c1"/><text x="240" y="133" font-size="14" fill="#f3f0e9" font-weight="600" >Components</text><text x="240" y="151" font-size="11" fill="#a9b9b8" font-weight="400" >States · accessibility</text><rect x="24" y="181" width="3" height="32" rx="1.5" fill="#67e0c1"/><text x="36" y="193" font-size="14" fill="#f3f0e9" font-weight="600" >Motion</text><text x="36" y="211" font-size="11" fill="#a9b9b8" font-weight="400" >Purpose · restraint</text><rect x="228" y="181" width="3" height="32" rx="1.5" fill="#67e0c1"/><text x="240" y="193" font-size="14" fill="#f3f0e9" font-weight="600" >Responsive</text><text x="240" y="211" font-size="11" fill="#a9b9b8" font-weight="400" >Mobile · desktop</text></svg>