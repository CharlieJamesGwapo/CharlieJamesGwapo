<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Charlie James Abejo — AI systems and real products</title><desc id="desc">Original portfolio artwork. Subtle animated connectors; respects reduced motion.</desc><style>
text{font-family:Segoe UI,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.flow{stroke-dasharray:6 14;animation:flow 8s linear infinite}.signal{animation:signal 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-160}}@keyframes signal{0%,100%{opacity:.4}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.signal{animation:none!important}}
</style><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#67e0c1" stroke-opacity=".065" stroke-width="1"/></pattern><radialGradient id="glow"><stop stop-color="#67e0c1" stop-opacity=".12"/><stop offset="1" stop-color="#0b2528" stop-opacity="0"/></radialGradient></defs><rect width="900" height="320" rx="20" fill="#0b2528"/><rect width="900" height="320" rx="20" fill="url(#grid)"/><ellipse cx="720.0" cy="128.0" rx="405.0" ry="288.0" fill="url(#glow)"/><rect x=".5" y=".5" width="899" height="319" rx="19.5" fill="none" stroke="#295054"/><text x="36" y="42" font-size="12" fill="#67e0c1" font-weight="600" letter-spacing="2">CHARLIE JAMES ABEJO</text><text x="36" y="112" font-size="53" fill="#f3f0e9" font-weight="650" >AI systems.</text><text x="36" y="174" font-size="53" fill="#67e0c1" font-weight="650" >Real products.</text><text x="38" y="221" font-size="17" fill="#a9b9b8" font-weight="400" >From a business idea to reliable operation.</text><text x="38" y="279" font-size="11" fill="#67e0c1" font-weight="500" letter-spacing="1.4">DESIGN  /  BUILD  /  CONNECT  /  SHIP</text><rect x="614" y="34" width="230" height="60" rx="14" fill="#123438" stroke="#295054"/><rect x="626" y="46" width="35" height="35" rx="10" fill="#1e4848"/><text x="636" y="69" font-size="13" fill="#67e0c1" font-weight="600" >01</text><text x="674" y="59" font-size="16" fill="#f3f0e9" font-weight="600" >Product experience</text><text x="674" y="78" font-size="11" fill="#a9b9b8" font-weight="400" >Interfaces people can use</text><rect x="614" y="130" width="230" height="60" rx="14" fill="#123438" stroke="#295054"/><rect x="626" y="142" width="35" height="35" rx="10" fill="#1e4848"/><text x="636" y="165" font-size="13" fill="#67e0c1" font-weight="600" >02</text><text x="674" y="155" font-size="16" fill="#f3f0e9" font-weight="600" >AI &amp; automation</text><text x="674" y="174" font-size="11" fill="#a9b9b8" font-weight="400" >Tools, voice and workflows</text><rect x="614" y="226" width="230" height="60" rx="14" fill="#123438" stroke="#295054"/><rect x="626" y="238" width="35" height="35" rx="10" fill="#1e4848"/><text x="636" y="261" font-size="13" fill="#67e0c1" font-weight="600" >03</text><text x="674" y="251" font-size="16" fill="#f3f0e9" font-weight="600" >Connected systems</text><text x="674" y="270" font-size="11" fill="#a9b9b8" font-weight="400" >APIs, data and operations</text><path d="M729 94V130" stroke="#295054" stroke-width="2"/><path class="flow" d="M729 94V130" stroke="#67e0c1" stroke-width="2"/><path d="M729 190V226" stroke="#295054" stroke-width="2"/><path class="flow" d="M729 190V226" stroke="#67e0c1" stroke-width="2"/><path d="M576 64V256" stroke="#295054"/><circle class="signal" cx="576" cy="64" r="4" fill="#67e0c1"/></svg>