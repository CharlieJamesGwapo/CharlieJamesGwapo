<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" role="img" aria-labelledby="title desc"><title id="title">UI and UX: design tokens, accessible components, purposeful motion, responsive interfaces</title><desc id="desc">Original portfolio artwork. Subtle animated connectors; respects reduced motion.</desc><style>
text{font-family:Segoe UI,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.flow{stroke-dasharray:6 14;animation:flow 8s linear infinite}.signal{animation:signal 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-160}}@keyframes signal{0%,100%{opacity:.4}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.signal{animation:none!important}}
</style><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#67e0c1" stroke-opacity=".065" stroke-width="1"/></pattern><radialGradient id="glow"><stop stop-color="#67e0c1" stop-opacity=".12"/><stop offset="1" stop-color="#0b2528" stop-opacity="0"/></radialGradient></defs><rect width="900" height="160" rx="20" fill="#0b2528"/><rect width="900" height="160" rx="20" fill="url(#grid)"/><ellipse cx="720.0" cy="64.0" rx="405.0" ry="144.0" fill="url(#glow)"/><rect x=".5" y=".5" width="899" height="159" rx="19.5" fill="none" stroke="#295054"/><text x="24" y="32" font-size="11" fill="#67e0c1" font-weight="600" letter-spacing="1.5">UI / UX &amp; DESIGN SYSTEMS</text><text x="24" y="76" font-size="30" fill="#f3f0e9" font-weight="600" >Clear interfaces.</text><text x="24" y="113" font-size="30" fill="#67e0c1" font-weight="600" >Consistent systems.</text><rect x="440" y="46" width="3" height="32" rx="1.5" fill="#67e0c1"/><text x="452" y="58" font-size="14" fill="#f3f0e9" font-weight="600" >Tokens</text><text x="452" y="76" font-size="11" fill="#a9b9b8" font-weight="400" >Color · type · spacing</text><rect x="668" y="46" width="3" height="32" rx="1.5" fill="#67e0c1"/><text x="680" y="58" font-size="14" fill="#f3f0e9" font-weight="600" >Components</text><text x="680" y="76" font-size="11" fill="#a9b9b8" font-weight="400" >States · accessibility</text><rect x="440" y="96" width="3" height="32" rx="1.5" fill="#67e0c1"/><text x="452" y="108" font-size="14" fill="#f3f0e9" font-weight="600" >Motion</text><text x="452" y="126" font-size="11" fill="#a9b9b8" font-weight="400" >Purpose · restraint</text><rect x="668" y="96" width="3" height="32" rx="1.5" fill="#67e0c1"/><text x="680" y="108" font-size="14" fill="#f3f0e9" font-weight="600" >Responsive</text><text x="680" y="126" font-size="11" fill="#a9b9b8" font-weight="400" >Mobile · desktop</text></svg>